<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>录音人工复核 · voice_tools</title><link rel="icon" href="data:,">
<style>
:root{font:15px/1.55 system-ui,sans-serif;color:#193044;background:#f1f5f8;accent-color:#096c75}*{box-sizing:border-box}body{margin:0}header,main,footer{max-width:1400px;margin:auto;padding:20px 28px}header{display:flex;gap:20px;justify-content:space-between;align-items:center}h1{font-size:27px;letter-spacing:-.5px;margin:2px 0}h2{font-size:20px;overflow-wrap:anywhere;margin:0 0 10px}p{margin:7px 0}.eyebrow{color:#087078;font-size:12px;font-weight:700;letter-spacing:2px}a{color:#006c78}.muted{color:#526778;font-size:13px}.toolbar,.controls,.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.toolbar{background:white;padding:16px;border:1px solid #d9e4eb;border-radius:12px}label{display:flex;flex-direction:column;gap:5px;font-size:13px;min-width:0}input,select,textarea,button{font:inherit;border:1px solid #b8cbd7;border-radius:7px;padding:8px 10px;background:white;color:inherit;max-width:100%}button{cursor:pointer;min-height:40px}button:hover{background:#e6f2f3}button:disabled{opacity:.5;cursor:default}.primary{background:#086e77;color:white;border-color:#086e77}.primary:hover{background:#085b64}.workspace{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;margin-top:18px}aside,article{background:white;border:1px solid #d9e4eb;border-radius:12px;padding:18px;min-width:0}aside{align-self:start}#queue{display:flex;flex-direction:column;gap:7px;max-height:780px;overflow:auto;padding:3px}#queue button{flex:0 0 auto;text-align:left;overflow-wrap:anywhere;white-space:normal;font-size:13px;line-height:1.5}#queue button[aria-current=true]{border-color:#087078;box-shadow:inset 0 0 0 1px #087078;background:#e8f5f3}#queue small{display:block;margin-top:4px;color:#526778}.badge{background:#e4f1f3;padding:3px 8px;border-radius:20px;display:inline-block;font-size:12px}.warning{background:#fff5df;border-left:3px solid #c48015;padding:10px 13px;font-size:13px}.wave{width:100%;height:94px;display:block;background:#f4f8fa;border-radius:7px;margin:4px 0 12px}.track-title{font-size:13px;color:#486172}audio{width:100%;margin:10px 0}.time{font-variant-numeric:tabular-nums}input[type=number]{width:110px}input[type=range]{width:100%;padding:0}textarea{width:100%;min-height:70px}.review-form{border-top:1px solid #dce5ea;margin-top:18px;padding-top:16px}.review-form .row>*{flex:1 1 150px}.review-form .row{margin-bottom:12px}details{margin:12px 0}summary{cursor:pointer;font-size:14px}#message{min-height:26px;color:#9a3b00;font-weight:600;overflow-wrap:anywhere}#progress{font-size:13px}input[type=file]{font-size:12px;max-width:250px}.check{flex-direction:row;align-items:center;padding:10px 0}.clip-links{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:12px 0}footer{font-size:12px;color:#526778;padding-top:0}[hidden]{display:none!important}:focus-visible{outline:3px solid #df9a24;outline-offset:2px}@media(max-width:740px){header,main,footer{padding:14px}.workspace{grid-template-columns:1fr}#queue{max-height:180px}header{align-items:start;flex-direction:column;gap:7px}h1{font-size:24px}article,aside{padding:14px}.toolbar{gap:10px}.toolbar>label{flex:1 1 120px}.controls{gap:9px}input[type=number]{width:95px}}
</style></head><body>
<header><div><div class="eyebrow">VOICE TOOLS · LOCAL REVIEW</div><h1>听清这一轮，再留下判断</h1><p class="muted">波形与检测结果提供线索，人工标签保留你的结论。</p></div><a href="report.html">查看完整静态报告</a></header>
<main><div class="toolbar">
<label>录音<select id="fileFilter"><option value="">全部录音</option></select></label>
<label>检测结果<select id="statusFilter"><option value="">全部结果</option></select></label>
<label>证据<select id="evidenceFilter"><option value="">全部证据</option><option value="event_aligned">已对齐事件</option><option value="acoustic_only">仅声学证据</option></select></label>
<label class="check"><input type="checkbox" id="unreviewed">只看未标注</label>
<button id="export" class="primary">导出复核 CSV</button><label>导入已保存 CSV<input id="import" type="file" accept=".csv,text/csv"></label>
</div><p id="progress" aria-live="polite"></p><p id="message" role="status" aria-live="polite"></p>
<div class="workspace"><aside><h2>应答机会</h2><div id="queue"></div></aside><article id="detail" hidden>
<h2 id="name"></h2><p id="metadata" class="muted"></p><p id="status"></p><p id="warning" class="warning"></p>
<div class="track-title" id="leftTitle"></div><canvas class="wave" id="leftWave" width="1200" height="100" aria-label="左轨波形"></canvas>
<div class="track-title" id="rightTitle"></div><canvas class="wave" id="rightWave" width="1200" height="100" aria-label="右轨波形"></canvas>
<div class="controls"><label>试听声道<select id="channel"><option value="both">双轨</option><option value="left">只听左轨</option><option value="right">只听右轨</option></select></label>
<label>试听起点（秒）<input id="start" type="number" min="0" step="0.1"></label><label>试听终点（秒）<input id="end" type="number" min="0" step="0.1"></label>
<label class="check"><input id="loop" type="checkbox" checked>循环所选区间</label><button id="play">播放 / 暂停</button></div>
<audio id="player" controls preload="metadata"></audio><input id="seek" type="range" min="0" step="0.01" value="0" aria-label="跳转播放时间"><p id="time" class="time muted"></p>
<div class="clip-links"><a id="clip" download>下载原窗口片段</a><a id="clipMeta" download>下载片段时间映射</a></div><p class="muted">调整试听范围不会改变标注窗口。下载片段包含原窗口前 2 秒、后 1 秒，并保留原始声道。</p>
<form id="reviewForm" class="review-form"><div class="row"><label>人工判断<select id="decision" required><option value="">请选择</option><option value="missing">1 · 缺失回答</option><option value="delayed">2 · 回答迟到</option><option value="audible">3 · 有可听回答</option><option value="exclude">4 · 无需应答</option><option value="uncertain">5 · 无法判断</option></select></label><label>复核人<input id="reviewer" required autocomplete="off" maxlength="100"></label></div>
<label>复核说明<textarea id="notes" maxlength="5000"></textarea></label>
<details><summary>回答时间与分组信息（用于分层评估）</summary><div class="row"><label>首次可听回答（绝对秒）<input id="first_audible_s" type="number" min="0" step="0.01"></label><label>应答时限（秒）<input id="deadline_s" type="number" min="0.1" step="0.1"></label><label>策略版本<input id="policy_id"></label></div><div class="row"><label>是否应答<select id="expected_response"><option value="">未记录</option><option value="true">是</option><option value="false">否</option></select></label><label>场景（多个用 ; 分隔）<input id="scenario"></label><label>线路<input id="line_id"></label></div><div class="row"><label>通话/来源分组 ID<input id="group_id"></label><label>样本集合<select id="split"><option value="">未分组</option><option value="calibration">校准集</option><option value="validation">留出验证集</option></select></label></div></details>
<div class="controls"><button class="primary" type="submit">记下标注（待导出）</button><button id="discard" type="button">放弃表单修改</button><button id="previous" type="button">上一条</button><button id="next" type="button">下一条</button></div><p class="muted">快捷键：空格播放，1–5 选择判断，左右方向键切换机会。填写表单时不触发快捷键。</p>
</form></article></div></main><footer>所有数据仅在本页处理。离开前导出 CSV；重新打开后可导入继续复核。没有附带音频时仍可查看波形，试听需重新分析并指定 --include-audio。</footer>
<script id="reviewData" type="application/json">__REVIEW_DATA__</script><script>__REVIEW_SCRIPT__</script></body></html>
