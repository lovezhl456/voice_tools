<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="voice-tools-session" content="__SESSION__">
<title>录音质检工作台 · voice_tools</title>
<link rel="stylesheet" href="/recordings/style.css">
<script src="/recordings/timeline.js" defer></script>
<script src="/recordings/app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="brand"><span aria-hidden="true" class="brand-mark">▏▊▍</span><h1>录音质检工作台</h1></div>
  <nav aria-label="规则与拨测">
    <button id="library-open">全局规则库</button>
    <button id="ai-open">与 AI 定规则</button>
    <button id="import-open">导入规则</button>
    <a id="dialing" href="http://127.0.0.1:8080/voice-tasks/">批量拨测工作台 ↗</a>
  </nav>
  <button id="export-open" class="primary" disabled>导出所选录音（0）</button>
</header>
<main>
  <aside class="sidebar">
    <div class="side-head"><h2>录音文件夹</h2><button id="folder-open">关联</button></div>
    <div id="folder-name" class="muted folder-name">尚未关联</div>
    <input id="file-search" type="search" placeholder="查找录音" aria-label="查找录音">
    <div class="list-controls"><label><input id="select-all" type="checkbox"> 全选当前列表</label><button id="rescan">刷新</button></div>
    <div id="files" aria-label="录音文件"></div>
    <a class="archive-link" href="http://127.0.0.1:8080/voice-workbench/legacy.html#detection">历史报告 ↗</a>
  </aside>
  <section class="detail">
    <div id="notice" class="notice" role="status" hidden></div>
    <div id="job" class="notice" hidden></div>
    <div class="detail-head">
      <div><h2 id="recording-name">选择一通录音</h2><div id="recording-meta" class="muted"></div></div>
      <div class="run-actions"><button id="run-current" disabled>标注当前录音</button><button id="run-batch" class="primary" disabled>批量标注文件夹</button></div>
    </div>
    <div class="enabled"><button id="rules-open">选择本次规则</button><span id="enabled"></span></div>
    <p id="empty" class="empty">关联本机录音文件夹后，可以从左栏选一通试听。</p>
    <div id="recording" hidden>
      <div class="section-head"><h3>录音时间轴</h3><div>
        <label>试听 <select id="channel"><option value="both">双声道</option><option value="left">左声道</option><option value="right">右声道</option></select></label>
        <button id="duplexZoomOut" aria-label="缩小录音时间轴">−</button>
        <button id="duplexFit">全长</button>
        <button id="duplexZoomIn" aria-label="放大录音时间轴">＋</button>
      </div></div>
      <audio id="player" controls preload="metadata"></audio>
      <div id="distribution"></div>
      <div class="timeline-axis"><div id="annotationTime"></div></div>
      <div id="duplexTimeline" class="duplex-timeline">
        <div id="duplexChannels" class="duplex-channels"><span id="duplexLeft"></span><span id="duplexRight"></span></div>
        <div id="duplexWave" class="duplex-wave"><canvas id="duplexCanvas" aria-hidden="true"></canvas><span id="duplexRange" hidden></span><span id="duplexEvidence" hidden></span><span id="duplexPlayhead" hidden></span></div>
        <div id="annotationTimeline" hidden></div>
      </div>
      <div id="lanes"></div>
      <details id="evaluations" hidden><summary>检测记录</summary><ul id="evaluation-list"></ul></details>
      <div class="section-head review-head"><h3>命中明细 <span id="mark-count" class="muted"></span></h3><div>
        <label><input id="pending-only" type="checkbox"> 只看待核</label>
        <button id="manual-open">人工补标</button><button id="next">下一待核</button>
      </div></div>
      <div id="marks-scroll"><table><thead><tr><th>规则</th><th>时间段 / 时长</th><th>人工复核</th><th>操作</th></tr></thead><tbody id="marks"></tbody></table></div>
      <div id="review-pane" class="review-pane" hidden></div>
    </div>
  </section>
</main>
<dialog id="dialog"><form id="dialog-form"><div class="section-head"><h2 id="dialog-title"></h2><button type="button" id="close" aria-label="关闭窗口">关闭</button></div><div id="dialog-body"></div><p id="dialog-status" class="muted" role="status"></p></form></dialog>
</body>
</html>
