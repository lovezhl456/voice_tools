name: Review acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.artifacts/playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install test dependencies
        run: |
          python -m pip install 'numpy>=1.24,<3' 'setuptools>=61' wheel
          npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
          tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Critical decision and data-contract regressions
        run: |
          PYTHONPATH=src python -m unittest \
            tests.recording_qa.test_assessment \
            tests.recording_qa.test_assessment_waveform \
            tests.recording_qa.test_assessment_delivery \
            tests.test_review_runner -v
      - name: Installed-wheel browser acceptance
        run: python scripts/check_review.py --out .artifacts/review
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-acceptance-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            .artifacts/review/verification.json
            .artifacts/review/*.log
            .artifacts/review/site/fixtures.json
            .artifacts/review/wheels/*.whl
            .artifacts/review/browser-results.json
            .artifacts/review/browser-results/
            .artifacts/review/browser-report/
